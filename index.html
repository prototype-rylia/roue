<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue de la Fortune</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- ✅ Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --primary: #FF8C00; 
            --dark: #2D3436; 
            --light: #F1F2F6; 
            --white: #FFFFFF; 
            --success: #2ecc71; 
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--light); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px 0;
        }
        
        .main-container { 
            width: 95%; 
            max-width: 420px; 
            background: var(--white); 
            padding: 30px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            text-align: center; 
        }

        h1 { color: var(--primary); margin-bottom: 25px; }
        
        .wheel-wrapper { 
            position: relative; 
            margin: 20px auto; 
            width: 300px; 
            height: 300px; 
            background: #dfe6e9;
            border-radius: 50%;
            padding: 8px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.15);
        }

        #center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: var(--white);
            border: 4px solid var(--primary);
            border-radius: 50%;
            color: var(--primary);
            font-weight: 900;
            cursor: pointer;
            z-index: 30; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        #center-btn:not(:disabled) { animation: attractivePulse 2s infinite; }

        @keyframes attractivePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.7); transform: translate(-50%, -50%) scale(1); }
            70% { box-shadow: 0 0 0 15px rgba(255, 140, 0, 0); transform: translate(-50%, -50%) scale(1.08); }
            100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); transform: translate(-50%, -50%) scale(1); }
        }
        
        #center-btn:disabled { 
            background: #dfe6e9; 
            border-color: #b2bec3; 
            color: #b2bec3; 
            cursor: not-allowed; 
            animation: none;
        }

        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 40px; color: var(--primary); z-index: 20; }
        canvas { display: block; margin: 0 auto; border-radius: 50%; }
        
        #countdown-display {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            color: var(--dark);
            font-weight: bold;
            border: 2px solid #eee;
            min-height: 20px;
        }

        .btn-cgu {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            color: #95a5a6;
            text-decoration: underline;
            background: none;
            border: none;
            cursor: pointer;
        }

        .result-box { margin-top: 25px; padding-top: 20px; border-top: 2px dashed #eee; display: none; }
        
        .acceptation-text {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        @keyframes zoom-in-out {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .zoom-anim {
            display: inline-block;
            animation: zoom-in-out 1.5s infinite ease-in-out;
        }

        input { width: 90%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; text-align: center; font-size: 16px; }
        .btn-action { background: var(--dark); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>Tentez votre chance !</h1>
    
    <div class="wheel-wrapper">
        <div class="wheel-pointer">▼</div>
        <button id="center-btn" onclick="handleButtonClick()">
            <span id="btn-icon" style="font-size: 20px;">⭐</span>
            <span id="btn-text" style="font-size: 14px;">AVIS</span>
        </button>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    
    <div id="countdown-display">Vérification...</div>
    
    <button class="btn-cgu" onclick="openLegalPage()">CGU & Mentions Légales</button>

    <div id="email-area" class="result-box">
        <h2 id="win-message" class="zoom-anim" style="color: var(--primary);"></h2>
        <p class="acceptation-text">En participant à ce jeu, vous acceptez nos conditions générales d'utilisation</p>
        <p>Saisissez vos informations pour recevoir votre cadeau :</p>
        <input type="text" id="client-name" placeholder="Votre prénom...">
        <input type="email" id="client-email" placeholder="Votre adresse e-mail...">
        
        <div style="text-align: left; margin: 10px 5%; font-size: 13px; color: #7f8c8d; display: flex; align-items: flex-start;">
            <input type="checkbox" id="marketing-consent" style="width: 18px; height: 18px; margin-right: 10px; cursor: pointer; flex-shrink: 0;">
            <label for="marketing-consent" style="cursor: pointer; line-height: 1.2;">J'accepte de recevoir les offres promotionnelles du restaurant par e-mail.</label>
        </div>

        <button id="final-submit" onclick="submitAndFinish()" class="btn-action">RECEVOIR MON COUPON</button>
    </div>

    <div id="success-area" class="result-box">
        <h2 style="color: var(--success);">C'est envoyé !</h2>
        <p>Vérifiez votre boîte mail (ainsi que vos spams).</p>
        <button onclick="location.reload()" class="btn-action">RETOUR</button>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-content">
        <h2 style="color: var(--primary);">Félicitations ! 🎁</h2>
        <p>Vous avez gagné : <br><strong id="prize-display" class="zoom-anim" style="font-size: 1.4em;"></strong></p>
        <button onclick="closeModalAndUnlock()" class="btn-action">RÉCUPÉRER MON COUPON</button>
    </div>
</div>

<script>
    // ============================================================
    // ✅ CONFIGURATION FIREBASE — remplacez par vos propres valeurs
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDjLfEdyvYlKKJA7p-2cSkP2kNv0pjjZz0",
      authDomain: "dashboard-roue.firebaseapp.com",
      projectId: "dashboard-roue",
      storageBucket: "dashboard-roue.firebasestorage.app",
      messagingSenderId: "109735141824",
      appId: "1:109735141824:web:2e80a4400db5af5674e825"
    };

    // ✅ UID du client (copié depuis Firebase Authentication > Users)
    // Chaque fichier wheel.html est propre à un client — mettez son UID ici
    const CLIENT_ID = "5Zee4LRp05WCWrW695eaHoj3PKK2";

    // Initialisation Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // ✅ EmailJS — conservé tel quel
    // ============================================================
    (function() { emailjs.init("Xfwt-_9NJQOGH4NLH"); })();

    // ============================================================
    // Configuration des lots — chargée depuis Firestore
    // ============================================================
    const defaultPrizeConfig = [
        { label: "Menu taille M",    chance: 2.0,  color: "rgba(255, 140, 0, 0.5)" },
        { label: "-10% commande",    chance: 2.5,  color: "#FFFFFF" },
        { label: "Dessert au choix", chance: 2.5,  color: "rgba(255, 140, 0, 0.5)" },
        { label: "-5% commande",     chance: 6.0,  color: "#FFFFFF" },
        { label: "x4 Snack",         chance: 7.0,  color: "rgba(255, 140, 0, 0.5)" },
        { label: "Une boisson",      chance: 80.0, color: "#FFFFFF" }
    ];

    let prizeConfig = [...defaultPrizeConfig];

    // Charger la config depuis Firestore
    async function loadPrizeConfig() {
        try {
            const doc = await db.collection("clients").doc(CLIENT_ID).collection("config").doc("wheel").get();
            if (doc.exists && doc.data().prizes && doc.data().prizes.length > 0) {
                const prizes = doc.data().prizes;
                prizeConfig = prizes.map((p, i) => ({
                    label: p.label,
                    chance: p.chance,
                    color: i % 2 === 0 ? "rgba(255, 140, 0, 0.5)" : "#FFFFFF"
                }));
            }
        } catch (err) {
            console.warn("Config Firestore non trouvée, utilisation des valeurs par défaut.", err);
        }

        // Recalculer arc et redessiner
        arc = Math.PI / (prizeConfig.length / 2);
        drawWheel();
    }

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    let arc = Math.PI / (prizeConfig.length / 2);
    let startAngle = 0;
    let wonPrize = "";
    let isUnlocked = false;
    let cooldownInterval;

    function drawWheel() {
        ctx.clearRect(0, 0, 300, 300);
        prizeConfig.forEach((p, i) => {
            let angle = startAngle + i * arc;

            ctx.save();
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 145, angle, angle + arc);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = "#e0e0e0";
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 145, angle, angle + arc);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = (p.color === "#FFFFFF") ? "#FF8C00" : "white";
            ctx.font = "bold 11px Arial";
            ctx.translate(150 + Math.cos(angle + arc/2)*100, 150 + Math.sin(angle + arc/2)*100);
            ctx.rotate(angle + arc/2 + Math.PI/2);
            const label = p.label || "";
            ctx.fillText(label, -ctx.measureText(label).width/2, 0);
            ctx.restore();
        });
    }

    function openLegalPage() {
        const legalWindow = window.open("", "_blank");
        legalWindow.document.write(`
            <html>
            <head>
                <title>CGU & Mentions Légales</title>
                <style>
                    body { 
                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
                        line-height: 1.6; 
                        padding: 50px; 
                        color: #2d2d2d; 
                        max-width: 750px; 
                        margin: auto; 
                    }
                    h1 { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 40px; border-bottom: 2px solid #000; padding-bottom: 10px; }
                    h2 { font-size: 1.2rem; font-weight: 700; margin-top: 30px; }
                    h3 { font-size: 1rem; font-weight: 700; color: #555; }
                    p, li { font-size: 0.95rem; color: #444; }
                    ul { padding-left: 20px; }
                    hr { border: 0; border-top: 1px solid #eee; margin: 40px 0; }
                </style>
            </head>
            <body>
                <h1>Mentions Légales & CGU</h1>

                <section>
                    <h2>I. ÉDITION ET HÉBERGEMENT</h2>
                    <p><strong>Éditeur :</strong> Ce site est édité par l'établissement <strong>[NOM DU RESTAURANT]</strong>, [FORME JURIDIQUE] au capital de [MONTANT] €, situé à [ADRESSE COMPLÈTE]. SIRET : [NUMÉRO].</p>
                    <p><strong>Hébergement :</strong> Ce site est hebergé par GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis.</p>
                    <p><strong>Conception technique :</strong> Rylia | contact@rylia.fr</p>
                </section>

                <section>
                    <h2>II. CONDITIONS GÉNÉRALES D'UTILISATION</h2>
                    
                    <h3>1. Objet du programme</h3>
                    <p>L'utilisateur est invité à déposer un avis Google, le jeu est gratuit sans obligation d'achat. Les lots gagnés consistent en des avantages commerciaux soumis à conditions de consommation dans l'établissement</p>

                    <h3>2. Participation</h3>
                    <p>La participation est limitée à une seule tentative par personne et par période de 24 heures. Un contrôle technique (cookies/localStorage) est mis en place pour assurer le respect de cette règle.</p>
                </section>

                <section>
                    <h2>III. PROTECTION DES DONNÉES (RGPD)</h2>
                    <p>Les informations collectées (Prénom, E-mail) sont nécessaires pour l'envoi du coupon de réduction et, sous réserve de votre consentement, pour l'envoi d'offres promotionnelles par le restaurant.</p>

                    • Finalité : Gestion du jeu-concours et prospection commerciale.<br>
                    • Destinataires : Le personnel habilité du restaurant. Les données sont stockées via des outils sécurisés (Firebase / EmailJS).<br>
                    • Durée de conservation : Les données sont conservées pour une durée maximale de 3 ans à compter du dernier contact avec le client.<br>
                    • Vos droits : Conformément à la loi "Informatique et Libertés", vous disposez d'un droit d'accès, de rectification, de suppression et d'opposition concernant vos données. Pour l'exercer, contactez : [E-MAIL DU RESTAURANT].</p>
                </section>

                <section>
                    <h2>IV. MÉDIATION DE LA CONSOMMATION</h2>
                    <p>Conformément aux articles L.616-1 et R.616-1 du code de la consommation, en cas de litige non résolu directement avec l'établissement, le client peut recourir gratuitement au médiateur de la consommation saisi par le restaurant :</p>
                    <p>[NOM DU MÉDIATEUR DE L'ÉTABLISSEMENT]<br>Adresse : [ADRESSE DU MÉDIATEUR]<br>Site internet : [SITE DU MÉDIATEUR]</p>
                </section>

                <hr>
                <p style="font-size: 0.8rem; color: #999;">Dernière mise à jour : 24/02/2026</p>
            </body>
            </html>
        `);
    }

    function checkCooldown() {
        const lastSpin = localStorage.getItem("lastSpinTimestamp");
        const statusDisplay = document.getElementById("countdown-display");
        const centerBtn = document.getElementById("center-btn");

        if (!lastSpin) {
            statusDisplay.innerText = "Laissez un avis pour débloquer la roue !";
            centerBtn.disabled = false;
            return false;
        }

        const now = Date.now();
        const waitTime = 24 * 60 * 60 * 1000;
        const elapsed = now - parseInt(lastSpin);
        const remaining = waitTime - elapsed;

        if (remaining > 0) {
            centerBtn.disabled = true;
            if (cooldownInterval) clearInterval(cooldownInterval);
            cooldownInterval = setInterval(() => {
                const currentNow = Date.now();
                const currentRemaining = waitTime - (currentNow - parseInt(lastSpin));
                if (currentRemaining <= 0) {
                    clearInterval(cooldownInterval);
                    centerBtn.disabled = false;
                    statusDisplay.innerText = "Bon retour ! Déposez un avis pour jouer.";
                    localStorage.removeItem("lastSpinTimestamp");
                } else {
                    const h = Math.floor(currentRemaining / 3600000).toString().padStart(2, '0');
                    const m = Math.floor((currentRemaining % 3600000) / 60000).toString().padStart(2, '0');
                    const s = Math.floor((currentRemaining % 60000) / 1000).toString().padStart(2, '0');
                    statusDisplay.innerHTML = `Prochaine tentative dans <br><span style="color:var(--primary); font-size:1.2em;">${h}h ${m}m ${s}s</span>`;
                }
            }, 1000);
            return true;
        } else {
            centerBtn.disabled = false;
            statusDisplay.innerText = "Laissez un avis pour débloquer la roue !";
            return false;
        }
    }

    function handleButtonClick() {
        if (!isUnlocked) {
            window.open("https://search.google.com/local/writereview?placeid=ChIJW1Rose0ow0cR9zaLbFnaS-Y", "_blank");
            isUnlocked = true;
            document.getElementById("btn-icon").style.display = "none";
            document.getElementById("btn-text").innerText = "GO";
            document.getElementById("btn-text").style.fontSize = "22px";
            document.getElementById("countdown-display").innerText = "Merci ! Cliquez sur GO pour lancer la roue.";
        } else {
            startSpin();
        }
    }

    function startSpin() {
        localStorage.setItem("lastSpinTimestamp", Date.now());
        document.getElementById("center-btn").disabled = true;
        
        let rand = Math.random() * 100;
        let cumulative = 0;
        let winnerIndex = 0;
        for (let i = 0; i < prizeConfig.length; i++) {
            cumulative += prizeConfig[i].chance;
            if (rand <= cumulative) { winnerIndex = i; break; }
        }
        wonPrize = prizeConfig[winnerIndex].label;
        let finalAngle = (8 * 2 * Math.PI) + ((2 * Math.PI) - (winnerIndex * arc) - (arc / 2) - (Math.PI / 2));
        let start = performance.now();
        function animate(time) {
            let t = (time - start) / 5000;
            if (t < 1) {
                startAngle = (1 - Math.pow(1 - t, 4)) * finalAngle;
                drawWheel();
                requestAnimationFrame(animate);
            } else {
                startAngle = finalAngle;
                drawWheel();
                document.getElementById("prize-display").innerText = wonPrize;
                document.getElementById("modal-overlay").style.display = "flex";
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
        }
        requestAnimationFrame(animate);
    }

    function closeModalAndUnlock() {
        document.getElementById("modal-overlay").style.display = "none";
        document.getElementById("win-message").innerText = "Gagné : " + wonPrize;
        document.getElementById("email-area").style.display = "block";
    }

    async function submitAndFinish() {
        const nom = document.getElementById("client-name").value;
        const mail = document.getElementById("client-email").value;
        const consent = document.getElementById("marketing-consent").checked;

        if (!mail.includes("@") || nom.length < 2) return alert("Veuillez remplir les champs.");
        if (!consent) return alert("Veuillez cocher la case pour accepter de recevoir votre coupon.");

        const btn = document.getElementById("final-submit");
        btn.disabled = true;
        btn.innerText = "Envoi...";

        const maintenant = new Date();
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        const heureGain  = maintenant.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const dateExp    = new Date(maintenant.getTime() + 864000000).toLocaleDateString('fr-FR');
        const dateDispo  = new Date(maintenant.getTime() + 86400000).toLocaleDateString('fr-FR');

        // ============================================================
        // ✅ SAUVEGARDE FIRESTORE — remplace l'ancien appel Google Sheets
        // Collection : clients/{CLIENT_ID}/participants
        // ============================================================
        try {
            await db.collection("clients").doc(CLIENT_ID).collection("participants").add({
                nom:              nom,
                email:            mail,
                gain:             wonPrize,
                code:             code,
                date:             firebase.firestore.FieldValue.serverTimestamp(),
                date_expiration:  dateExp,
                consent_marketing: consent
            });
        } catch (err) {
            console.error("Erreur Firestore :", err);
            // On continue quand même pour envoyer le mail
        }

        // ============================================================
        // ✅ EMAILJS — conservé tel quel
        // ============================================================
        emailjs.send('service_71cru5u', 'template_bj379nv', {
            client_nom:   nom,
            client_email: mail,
            gain_nom:     wonPrize,
            code_unique:  code,
            date_limite:  dateExp,
            date_dispo:   dateDispo,
            heure_gain:   heureGain
        }).then(() => {
            document.getElementById("email-area").style.display = "none";
            document.getElementById("success-area").style.display = "block";
            checkCooldown();
        }).catch((err) => {
            console.error("Erreur mail:", err);
            document.getElementById("email-area").style.display = "none";
            document.getElementById("success-area").style.display = "block";
        });
    }

    window.onload = async () => { 
        drawWheel(); 
        await loadPrizeConfig();
        checkCooldown(); 
    };
</script>
</body>
</html>
