<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rylia — Connexion</title>
    <link rel="icon" type="image/png" href="logo-rylia.png">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary-orange: #FF6B00;
            --dark-orange:    #E56000;
            --text-dark:      #1a1a1a;
            --text-light:     #444;
            --bg-light:       #f9f9f9;
            --border:         #e0e0e0;
            --danger-bg:      #ffe6e6;
            --danger-color:   #dc3545;
            --radius:         8px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- CONTENEUR --- */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary-orange);
            text-align: center;
        }

        /* --- BRAND --- */
        .brand-name {
            font-weight: 800;
            font-size: 2.2rem;
            color: var(--primary-orange);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* --- FORMULAIRE --- */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--text-dark);
            background: white;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
        }

        .form-input::placeholder { color: #C4C9D4; }

        /* Champ mot de passe avec bouton toggle */
        .input-wrapper { position: relative; }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-password:hover { color: var(--text-dark); }

        /* --- BOUTON --- */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.2s;
            margin-top: 10px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--dark-orange);
            box-shadow: 0 4px 14px rgba(255, 107, 0, 0.3);
        }

        .btn-submit:active:not(:disabled) { transform: scale(0.98); }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MOT DE PASSE OUBLIÉ --- */
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-light);
            text-decoration: none;
            margin-top: 6px;
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }

        .forgot-link:hover { color: var(--primary-orange); }

        /* --- MESSAGES --- */
        #error-msg {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: 600;
            display: none;
            background: var(--danger-bg);
            padding: 10px;
            border-radius: 6px;
        }

        #reset-msg {
            font-size: 0.85rem;
            margin-top: 12px;
            font-weight: 600;
            display: none;
            padding: 10px;
            border-radius: 6px;
        }

        #reset-msg.ok {
            color: #065F46;
            background: #ECFDF5;
        }

        #reset-msg.err {
            color: var(--danger-color);
            background: var(--danger-bg);
        }

        /* --- LIEN RETOUR --- */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--primary-orange); }

        @media (max-width: 440px) {
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="brand-name">Rylia.</div>
        <p class="login-subtitle">Connectez-vous à votre espace</p>

        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" class="form-input" placeholder="exemple@email.com"
                   autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <div class="input-wrapper">
                <input type="password" id="password" class="form-input" placeholder="Votre mot de passe"
                       autocomplete="current-password" required style="padding-right: 46px;">
                <button type="button" class="toggle-password" onclick="togglePwd()" aria-label="Afficher le mot de passe">
                    <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-submit" id="login-btn" onclick="handleLogin()">
            <span class="spinner" id="spinner"></span>
            <span id="btn-label">Se connecter</span>
        </button>

        <button class="forgot-link" onclick="resetPassword()">Mot de passe oublié ?</button>

        <div id="error-msg"></div>
        <div id="reset-msg"></div>

    </div>

    <div style="text-align: center;">
        <a href="index.html" class="back-link">← Retour au site</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey:            "AIzaSyDjLfEdyvYlKKJA7p-2cSkP2kNv0pjjZz0",
        authDomain:        "dashboard-roue.firebaseapp.com",
        projectId:         "dashboard-roue",
        storageBucket:     "dashboard-roue.firebasestorage.app",
        messagingSenderId: "109735141824",
        appId:             "1:109735141824:web:2e80a4400db5af5674e825"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Redirection automatique si déjà connecté
    auth.onAuthStateChanged((user) => {
        if (user) window.location.href = "dashboard.html";
    });

    // --- CONNEXION ---
    async function handleLogin() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        const resetMsg = document.getElementById('reset-msg');

        errorMsg.style.display = "none";
        resetMsg.style.display = "none";

        if (!email || !password) {
            showError("Veuillez remplir tous les champs.");
            return;
        }

        setLoading(true);

        try {
            await auth.signInWithEmailAndPassword(email, password);
            // La redirection est gérée par onAuthStateChanged ci-dessus
        } catch (err) {
            setLoading(false);
            showError(getErrorMessage(err.code));
        }
    }

    // --- MOT DE PASSE OUBLIÉ ---
    async function resetPassword() {
        const email    = document.getElementById('email').value.trim();
        const resetMsg = document.getElementById('reset-msg');
        const errorMsg = document.getElementById('error-msg');

        errorMsg.style.display = "none";
        resetMsg.style.display = "none";
        resetMsg.className     = "";

        if (!email) {
            resetMsg.innerText = "Saisissez votre email ci-dessus, puis cliquez sur « Mot de passe oublié ».";
            resetMsg.classList.add("err");
            resetMsg.style.display = "block";
            return;
        }

        try {
            await auth.sendPasswordResetEmail(email);
            resetMsg.innerText = "Un email de réinitialisation a été envoyé à " + email + ". Vérifiez votre boîte de réception.";
            resetMsg.classList.add("ok");
            resetMsg.style.display = "block";
        } catch (e) {
            if (e.code === "auth/user-not-found" || e.code === "auth/invalid-email") {
                resetMsg.innerText = "Aucun compte trouvé avec cet email.";
            } else {
                resetMsg.innerText = "Erreur lors de l'envoi. Réessayez.";
            }
            resetMsg.classList.add("err");
            resetMsg.style.display = "block";
        }
    }

    // --- HELPERS ---
    function getErrorMessage(code) {
        const map = {
            "auth/invalid-email":          "Le format de l'email est invalide.",
            "auth/user-not-found":         "Aucun compte trouvé avec cet e-mail.",
            "auth/wrong-password":         "Mot de passe incorrect.",
            "auth/invalid-credential":     "Email ou mot de passe incorrect.",
            "auth/too-many-requests":      "Trop de tentatives. Réessayez dans quelques minutes.",
            "auth/user-disabled":          "Ce compte a été désactivé.",
            "auth/network-request-failed": "Erreur réseau. Vérifiez votre connexion."
        };
        return map[code] || "Une erreur est survenue. Réessayez.";
    }

    function showError(msg) {
        const box = document.getElementById('error-msg');
        box.innerText = msg;
        box.style.display = "block";
    }

    function setLoading(on) {
        document.getElementById('login-btn').disabled    = on;
        document.getElementById('spinner').style.display = on ? "block" : "none";
        document.getElementById('btn-label').textContent = on ? "Connexion…" : "Se connecter";
    }

    function togglePwd() {
        const input = document.getElementById('password');
        input.type = input.type === "password" ? "text" : "password";
    }

    // Connexion avec la touche Entrée
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
